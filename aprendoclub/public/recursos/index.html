<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursos gratis de SEO, Social Media e IA | aprendoclub</title>
<meta name="description" content="Plantillas, skills, checklists, prompts y workflows gratuitos para impulsar tu carrera en marketing digital.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#08090D; --fondo:#0E1118; --superficie:#151922; --superficie-2:#1B202B;
  --borde:#252B38; --borde-claro:#333B4A;
  --lima:#C9F73D; --blanco:#FFF; --gris:#9AA4B4; --gris-2:#657084;
  --f:'Montserrat',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--blanco);font-family:var(--f);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.14;letter-spacing:-.025em;font-weight:700}
p{margin:0}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--lima);outline-offset:3px;border-radius:8px}

.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.rotulo{display:block;color:var(--lima);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}

.hero{text-align:center;padding:88px 0 56px;background:radial-gradient(ellipse 720px 360px at 50% -8%,rgba(201,247,61,.11),transparent 70%)}
.hero h1{font-size:clamp(34px,5.2vw,56px);font-weight:800;max-width:20ch;margin:20px auto 0}
.hero h1 span{color:var(--lima)}
.hero__sub{color:var(--gris);font-size:18px;max-width:58ch;margin:20px auto 0}

.nav{position:sticky;top:0;z-index:40;background:rgba(14,17,24,.92);backdrop-filter:blur(14px);padding:18px 0;border-bottom:1px solid var(--borde)}
.nav__in{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.nav__in::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:10px 18px;border-radius:999px;border:1px solid var(--borde);background:var(--superficie);color:var(--gris);font-size:14px;font-weight:500;font-family:var(--f);cursor:pointer;transition:border-color .16s,color .16s}
.chip:hover{border-color:var(--borde-claro);color:var(--blanco)}
.chip b{font-weight:600;margin-left:7px;color:var(--gris-2)}
.chip[aria-current="true"]{background:var(--lima);border-color:var(--lima);color:#0A0C10;font-weight:600}
.chip[aria-current="true"] b{color:rgba(10,12,16,.55)}

.estante{padding:60px 0 4px;scroll-margin-top:90px}
.estante__t{font-size:30px;font-weight:700;margin-top:11px}
.estante__d{color:var(--gris);font-size:15.5px;margin-top:9px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:28px}

.ficha{display:flex;flex-direction:column;background:var(--superficie);border:1px solid var(--borde);border-radius:22px;overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .3s}
.ficha:hover{transform:translateY(-4px);border-color:transparent;box-shadow:0 0 0 1px var(--lima),0 0 44px -12px rgba(201,247,61,.4)}
.previa{position:relative;height:150px;background:var(--negro);border-bottom:1px solid var(--borde);overflow:hidden}
.previa__doc{position:absolute;left:30px;right:30px;top:22px;bottom:-28px;background:var(--superficie-2);border:1px solid var(--borde);border-radius:9px 9px 0 0;padding:16px 17px}
.previa__tit{height:8px;width:54%;border-radius:4px;background:var(--lima);margin-bottom:13px}
.previa__l{height:5px;border-radius:3px;background:#2B3240;margin-bottom:8px}
.previa__blqs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.previa__b{height:26px;border-radius:5px;background:rgba(201,247,61,.14)}

.cuerpo{padding:20px 21px 21px;display:flex;flex-direction:column;flex:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cod{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--lima)}
.fmt{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gris-2);border:1px solid var(--borde);border-radius:5px;padding:3px 8px}
.ficha h3{font-size:18.5px;margin-bottom:9px}
.ficha p{font-size:14px;color:var(--gris);line-height:1.55;flex:1}
.btn{margin-top:19px;padding:12px;border-radius:999px;background:var(--lima);color:#0A0C10;font-weight:700;font-size:14.5px;text-align:center}

.pronto{margin-top:22px;padding:26px;border:1px dashed var(--borde-claro);border-radius:20px;color:var(--gris-2);font-size:14.5px;text-align:center}
.pie{padding:60px 0 80px;margin-top:52px;border-top:1px solid var(--borde);color:var(--gris-2);font-size:13.5px;text-align:center}

@media (max-width:820px){.hero{padding:56px 0 40px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="rotulo">Aprendo Space</span>
    <h1>Los mejores recursos de SEO, Social Media e <span>Inteligencia Artificial</span></h1>
    <p class="hero__sub">Plantillas, skills, checklists, prompts y workflows gratuitos para que impulses tu carrera en marketing digital.</p>
  </div>
</header>

<nav class="nav" aria-label="Ir a una categoría">
  <div class="wrap nav__in" id="nav"></div>
</nav>

<main class="wrap" id="estantes"></main>

<footer class="pie">© 2026 aprendoclub · Hecho con 💚 para la comunidad SEO</footer>

<script>
/* ══════════════════════════════════════════════════════════
   Para agregar un recurso: añade un objeto a su categoría.
   "ruta" debe coincidir con la carpeta dentro de /recursos.
   ══════════════════════════════════════════════════════════ */
const CATS = [
  {
    id:'social', nombre:'Social Media',
    desc:'Para publicar con criterio y no por inercia.',
    items:[
      {
        cod:'SM-01',
        titulo:'De 0 a Social Media Manager',
        texto:'Tres skills para Claude que definen tu voz, generan ganchos virales y escriben tus guiones de reels.',
        formato:'3 skills',
        ruta:'/recursos/social-media-lab'
      }
    ]
  },
  { id:'seo', nombre:'SEO', desc:'Lo que aplicamos antes de escribir una sola palabra.', items:[] },
  { id:'ia',  nombre:'Inteligencia Artificial', desc:'Prompts y flujos para posicionar en ChatGPT y Gemini.', items:[] },
  { id:'contenido', nombre:'Creación de Contenido', desc:'Ideas, guiones y fórmulas listas para usar.', items:[] }
];

const nav=document.getElementById('nav');
const cont=document.getElementById('estantes');

CATS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='chip'; b.dataset.c=c.id;
  b.setAttribute('aria-current', i===0);
  b.innerHTML=c.nombre+'<b>'+c.items.length+'</b>';
  b.onclick=()=>document.getElementById('sec-'+c.id).scrollIntoView({behavior:'smooth',block:'start'});
  nav.appendChild(b);

  const s=document.createElement('section');
  s.className='estante'; s.id='sec-'+c.id;
  s.innerHTML='<span class="rotulo">'+c.items.length+' recursos</span>'+
    '<h2 class="estante__t">'+c.nombre+'</h2>'+
    '<p class="estante__d">'+c.desc+'</p>'+
    (c.items.length
      ? '<div class="grid">'+c.items.map(r=>`
          <a class="ficha" href="${r.ruta}">
            <div class="previa"><div class="previa__doc">
              <div class="previa__tit"></div>
              <div class="previa__l" style="width:95%"></div>
              <div class="previa__l" style="width:86%"></div>
              <div class="previa__l" style="width:69%"></div>
              <div class="previa__blqs"><div class="previa__b"></div><div class="previa__b"></div></div>
            </div></div>
            <div class="cuerpo">
              <div class="top"><span class="cod">${r.cod}</span><span class="fmt">${r.formato}</span></div>
              <h3>${r.titulo}</h3>
              <p>${r.texto}</p>
              <span class="btn">Ver recurso →</span>
            </div>
          </a>`).join('')+'</div>'
      : '<p class="pronto">Próximamente</p>');
  cont.appendChild(s);
});

const obs=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const id=e.target.id.replace('sec-','');
      [...nav.children].forEach(c=>c.setAttribute('aria-current', c.dataset.c===id));
    }
  });
},{rootMargin:'-90px 0px -60% 0px'});
document.querySelectorAll('.estante').forEach(s=>obs.observe(s));
</script>
</body>
</html>
