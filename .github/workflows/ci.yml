name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails (typecheck, migrations, build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aprendoclub
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Public assets guard
        working-directory: .
        run: bash scripts/check-public-assets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aprendoclub/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (informational, existing debt)
        run: npm run lint
        continue-on-error: true

      - name: Migrations apply on a fresh database
        run: npx payload generate:importmap && npx payload migrate

      - name: Seed content (build prerenders pages that need data)
        run: npm run seed

      - name: Build
        run: npx next build

      - name: Smoke test built app
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3100/ && break
            sleep 2
          done
          fail=0
          for path in / /programas /programas/diplomado /programas/reto /quienes-somos /blog /robots.txt /trabajemosjuntos/ /recursos/Socialmedia/masterclass/; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "http://localhost:3100$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
